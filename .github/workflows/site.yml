name: Site

on:
  push:
    branches:
      - master

jobs:
  storybook:
    runs-on: ubuntu-latest
    # One publish to gh-pages at a time: this job, Deploy Ocean Documentation and Release
    # notes share the queue and wait for each other.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn --frozen-lockfile

      # The build also writes the release notes page data. If GitHub cannot be read, the
      # Storybook is still published and that page shows a warning instead.
      - name: Deploy documentation
        run: yarn deploy:storybook -- --ci --keep-files docs/
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

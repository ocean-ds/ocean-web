name: Propagate to mfe-core

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da release a propagar, ex. v1.152.3
        required: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  bump:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MFE_CORE_APP_ID }}
          private-key: ${{ secrets.MFE_CORE_APP_PRIVATE_KEY }}
          owner: Pagnet
          repositories: mfe-core
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v4
        with:
          repository: Pagnet/mfe-core
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ runner.temp }}/pr-body.md
        run: |
          older() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$1" ]; }
          VERSION="${TAG#v}"
          CORE=$(npm view @useblu/ocean-core version)
          REACT=$(npm view @useblu/ocean-react version)
          LATEST=$(printf '%s\n%s\n' "$CORE" "$REACT" | sort -V | tail -n1)
          if older "$VERSION" "$LATEST"; then
            echo "v$VERSION é mais antiga que o latest do npm (v$LATEST). O bump é sempre para o latest: rode com v$LATEST."
            exit 1
          elif [ "$VERSION" != "$LATEST" ]; then
            echo "npm ainda não tem $VERSION (ocean-core $CORE, ocean-react $REACT)."
            exit 1
          fi
          FROM=$(grep -A1 -E '^"@useblu/ocean-(core|react)@' yarn.lock | grep -oE 'version "[^"]+"' | cut -d'"' -f2 | sort -V | tail -n1)
          yarn upgrade "@useblu/ocean-core@^$CORE" "@useblu/ocean-react@^$REACT"
          TAGS=$(gh release list -L 100 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' | while read -r t; do
            if older "$FROM" "${t#v}" && ! older "$VERSION" "${t#v}"; then echo "$t"; fi
          done | sort -rV)
          {
            echo "Bump automático de \`@useblu/ocean-core\` e \`@useblu/ocean-react\` de v$FROM para v$VERSION."
            for t in $TAGS; do
              echo
              gh release view "$t" --json body --jq .body
            done
          } > "$BODY"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ steps.app.outputs.token }}
          branch: chore/ocean-release
          commit-message: "chore(deps): Ocean ${{ env.TAG }}"
          title: "chore(deps): Ocean ${{ env.TAG }}"
          labels: dependencies
          body-path: ${{ runner.temp }}/pr-body.md
